name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pack and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELAYBASE_WORKER_GITHUB_REPO: ${{ github.repository }}
        run: bash scripts/publish-github-release.sh
